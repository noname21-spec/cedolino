(function(){var r=document.documentElement,el=document.getElementById("intro"),ui={};try{ui=JSON.parse(localStorage.getItem("cedolino.ui")||"{}")||{}}catch(e){}

var gia=false;try{gia=sessionStorage.getItem("cedolino.intro")==="1";sessionStorage.setItem("cedolino.intro","1")}catch(e){}
if(ui.intro===false||gia){el.remove();return}
var via=function(){if(el.parentNode)el.remove()};
